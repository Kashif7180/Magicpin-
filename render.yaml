services:
  - type: web
    name: magicpin-vera-bot
    env: python
    region: oregon
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn bot:app --host 0.0.0.0 --port $PORT --workers 1
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: LLM_PROVIDER
        value: gemini
      - key: BOT_URL
        value: http://localhost:8000
      - key: GEMINI_API_KEY
        sync: false
      - key: LLM_API_KEY
        sync: false
